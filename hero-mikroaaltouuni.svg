<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="t">
  <title id="t">Moderni mikroaaltouuni vaalean skandinaavisen keittiön työtasolla</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6fa"/>
      <stop offset="1" stop-color="#e6ecf4"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c49b"/>
      <stop offset="1" stop-color="#cfa877"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4168"/>
      <stop offset="1" stop-color="#1f2f4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.7">
      <stop offset="0" stop-color="#ffe3a6"/>
      <stop offset="0.55" stop-color="#ffbf4d"/>
      <stop offset="1" stop-color="#d46a06"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9a7a"/>
      <stop offset="1" stop-color="#4c7a5a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- seinä ja laatat -->
  <rect width="640" height="520" fill="url(#wall)"/>
  <g stroke="#d9e1ec" stroke-width="1">
    <path d="M0 150h640M0 210h640M0 270h640M0 330h640"/>
    <path d="M80 150v60M200 150v60M320 150v60M440 150v60M560 150v60M140 210v60M260 210v60M380 210v60M500 210v60M620 210v60M80 270v60M200 270v60M320 270v60M440 270v60M560 270v60"/>
  </g>

  <!-- ikkunan valo -->
  <path d="M430 0h210v260L520 120z" fill="#ffffff" opacity=".55"/>

  <!-- hylly -->
  <rect x="40" y="96" width="220" height="10" rx="3" fill="#cfa877"/>
  <rect x="40" y="104" width="220" height="4" fill="#b88f5f" opacity=".6"/>
  <!-- purkit -->
  <rect x="62" y="56" width="34" height="40" rx="6" fill="#ffffff" stroke="#d6dde8"/>
  <rect x="62" y="52" width="34" height="9" rx="3" fill="#b88f5f"/>
  <rect x="104" y="64" width="28" height="32" rx="6" fill="#ffffff" stroke="#d6dde8"/>
  <rect x="104" y="60" width="28" height="8" rx="3" fill="#b88f5f"/>
  <!-- kasvi -->
  <path d="M196 96h40l-5-30h-30z" fill="#f7f1e8" stroke="#e4d6c2"/>
  <path d="M216 66c-6-22-26-26-34-20 12 2 22 10 34 20z" fill="url(#leaf)"/>
  <path d="M216 66c2-26 20-36 30-30-12 4-22 14-30 30z" fill="url(#leaf)"/>
  <path d="M216 66c-2-18 4-34 10-40 2 14-2 28-10 40z" fill="#83ad8d"/>

  <!-- varjo mikron alla -->
  <ellipse cx="300" cy="402" rx="200" ry="16" fill="#0c1528" opacity=".22" filter="url(#soft)"/>

  <!-- mikroaaltouuni -->
  <rect x="118" y="196" width="364" height="206" rx="18" fill="url(#body)"/>
  <rect x="118" y="196" width="364" height="206" rx="18" fill="none" stroke="#14213a" stroke-opacity=".5"/>
  <!-- luukku -->
  <rect x="134" y="212" width="252" height="174" rx="10" fill="#14213a"/>
  <rect x="150" y="228" width="220" height="142" rx="6" fill="url(#glow)"/>
  <!-- sisävalo ja kulho -->
  <ellipse cx="260" cy="344" rx="84" ry="10" fill="#b04d09" opacity=".35"/>
  <path d="M210 318h100c0 22-22 32-50 32s-50-10-50-32z" fill="#ffffff"/>
  <ellipse cx="260" cy="318" rx="50" ry="8" fill="#f2f2f0"/>
  <ellipse cx="260" cy="318" rx="42" ry="5.5" fill="#f08a0c" opacity=".85"/>
  <!-- höyry -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M242 300c-8-10 8-16 0-28"/>
    <path d="M262 296c-8-10 8-16 0-30"/>
    <path d="M282 300c-8-10 8-16 0-28"/>
  </g>
  <rect x="150" y="228" width="220" height="142" rx="6" fill="url(#glass)"/>
  <!-- ritilä-kuvio lasissa -->
  <g fill="#14213a" opacity=".08">
    <circle cx="160" cy="238" r="2"/><circle cx="172" cy="238" r="2"/><circle cx="184" cy="238" r="2"/>
  </g>
  <!-- kahva -->
  <rect x="370" y="236" width="6" height="126" rx="3" fill="#48679b" opacity=".6"/>

  <!-- ohjauspaneeli -->
  <rect x="398" y="226" width="68" height="30" rx="7" fill="#0c1528"/>
  <text x="432" y="247" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffbf4d" letter-spacing="1">0:45</text>
  <g fill="#36507f">
    <rect x="400" y="270" width="28" height="14" rx="5"/><rect x="436" y="270" width="28" height="14" rx="5"/>
    <rect x="400" y="290" width="28" height="14" rx="5"/><rect x="436" y="290" width="28" height="14" rx="5"/>
  </g>
  <circle cx="432" cy="338" r="24" fill="#14213a"/>
  <circle cx="432" cy="338" r="17" fill="#36507f"/>
  <rect x="430" y="324" width="4" height="12" rx="2" fill="#ffbf4d"/>
  <!-- jalat -->
  <rect x="140" y="400" width="30" height="6" rx="3" fill="#0c1528"/>
  <rect x="430" y="400" width="30" height="6" rx="3" fill="#0c1528"/>

  <!-- työtaso -->
  <rect x="0" y="404" width="640" height="22" fill="url(#oak)"/>
  <rect x="0" y="424" width="640" height="3" fill="#b88f5f" opacity=".7"/>
  <!-- kaapistot -->
  <rect x="0" y="427" width="640" height="93" fill="#f8f9fb"/>
  <g stroke="#dfe4ec" stroke-width="2">
    <path d="M160 427v93M320 427v93M480 427v93"/>
  </g>
  <g fill="#c5d3e6">
    <rect x="120" y="446" width="28" height="4" rx="2"/><rect x="172" y="446" width="28" height="4" rx="2"/>
    <rect x="440" y="446" width="28" height="4" rx="2"/><rect x="492" y="446" width="28" height="4" rx="2"/>
  </g>

  <!-- muki -->
  <path d="M520 360h44v34a10 10 0 0 1-10 10h-24a10 10 0 0 1-10-10z" fill="#ffffff" stroke="#d6dde8"/>
  <path d="M564 368h6a10 10 0 0 1 0 20h-6" fill="none" stroke="#d6dde8" stroke-width="5"/>
  <rect x="520" y="372" width="44" height="6" fill="#f08a0c" opacity=".85"/>
  <!-- leikkuulauta -->
  <rect x="30" y="330" width="62" height="74" rx="10" fill="#d9b98f" stroke="#b88f5f"/>
  <circle cx="61" cy="344" r="5" fill="#f3f6fa"/>
</svg>
